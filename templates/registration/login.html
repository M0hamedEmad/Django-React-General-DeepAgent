<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f8;
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2328; }
    form { width: 360px; background: #fff; border: 1px solid #e6e7ea; border-radius: 16px; padding: 32px;
           box-shadow: 0 8px 30px rgba(0,0,0,.05); }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
    p.sub { margin: 0 0 24px; color: #6b7280; }
    label { display: block; font-size: 13px; color: #4b5563; margin: 12px 0 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #d0d3d9; border-radius: 10px; font: inherit; }
    input:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
    button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 10px; background: #111827;
             color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #1f2937; }
    .error { background: #fef2f2; color: #b91c1c; border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  </style>
</head>
<body>
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <h1>Sign in</h1>
    <p class="sub">Your company assistant</p>
    {% if form.errors %}<div class="error">Wrong username or password.</div>{% endif %}
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" autofocus autocomplete="username" required>
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next|default:'/chat/' }}">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
